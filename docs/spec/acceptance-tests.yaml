spec_version: 1.0.0
status: design_requirements_not_executed
tests:
- id: SEC-001
  phase: M0
  area: 安全與隔離
  title: 跨workspace物件讀取
  given: A/B workspace各有相同名稱的品牌與對話
  when: A token改URL/body查B conversation
  then: 404/403；response/log/WS/統計無B內容
  blocking: true
  critical: true
- id: SEC-002
  phase: M0
  area: 安全與隔離
  title: 同workspace跨品牌隔離
  given: 客服只獲brand A inbox授權
  when: 搜尋/列表/報表/附件改為brand B
  then: 無原文、姓名、count或附件資訊洩漏
  blocking: true
  critical: true
- id: SEC-003
  phase: M0
  area: 安全與隔離
  title: 複合外鍵
  given: A conversation與B contact存在
  when: 直接以runtime DB連線插入跨workspace parent id
  then: DB FK拒絕，不只Controller拒絕
  blocking: true
  critical: true
- id: SEC-004
  phase: M0
  area: 安全與隔離
  title: Agent不是Supervisor
  given: Agent可看自己案件與未分派佇列
  when: 查同團隊另一客服已接案件
  then: 依預設拒絕；主管指定scope可查看
  blocking: true
  critical: true
- id: SEC-005
  phase: M0
  area: 安全與隔離
  title: 角色不可自我提權
  given: Operations Admin缺Owner/特定grant
  when: 建立角色並給自己Owner或超出scope權限
  then: 403並audit，未改資料
  blocking: true
  critical: true
- id: SEC-006
  phase: M0
  area: 安全與隔離
  title: 長駐context不殘留
  given: 同一Octane worker依序或交錯服務A/B workspace
  when: 使用不同AI credentials、locale與Policy scope
  then: 不共用或殘留另一workspace的key/context
  blocking: true
  critical: true
- id: SEC-007
  phase: M1
  area: 安全與隔離
  title: 內部備註永不外洩
  given: 客服新增internal note
  when: 前台GET/WS/events/export webhook讀取同對話
  then: Public DTO與public channel完全無note或敏感metadata
  blocking: true
  critical: true
- id: SEC-008
  phase: M1
  area: 安全與隔離
  title: Socket授權
  given: Visitor知道另一conversation/session channel名稱
  when: 呼叫broadcast auth或重用錯session資訊
  then: 拒絕；無資料推送
  blocking: true
  critical: true
- id: SEC-009
  phase: M1
  area: 安全與隔離
  title: 撤銷既有socket
  given: 使用者已有訂閱且client不配合logout
  when: 後端停用staff/visitor或取消權限
  then: 60秒內不再收到新事件，不能靠只驗證subscribe
  blocking: true
  critical: true
- id: SEC-010
  phase: M1
  area: 安全與隔離
  title: CSRF
  given: Staff已有cookie
  when: 跨來源表單/缺CSRF發送管理寫入
  then: 拒絕，合法同站CSRF流程可用
  blocking: true
  critical: true
- id: SEC-011
  phase: M3
  area: 安全與隔離
  title: Secret不可讀
  given: 設定provider key與webhook secret
  when: 讀取API/HTML/日誌/錯誤/匯出/稽核
  then: 不含明文secret，僅masked/present
  blocking: true
  critical: true
- id: SEC-012
  phase: M3
  area: 安全與隔離
  title: SSRＦ全面覆蓋
  given: 可配置provider URL、webhook、知識URL、附件URL
  when: 輸入localhost/RFC1918/metadata/IPv6/redirect/DNS rebinding案例
  then: 預設擋下；明確platform-approved host/port例外受控
  blocking: true
  critical: true
- id: ID-001
  phase: M1
  area: 身分與SDK
  title: 偽造會員ID
  given: 未登入visitor
  when: 只傳user_id/email或修改JWT claims
  then: 無法取得已驗證會員與其歷史
  blocking: true
  critical: true
- id: ID-002
  phase: M1
  area: 身分與SDK
  title: JWT完整驗證
  given: 合法issuer與簽章測試key
  when: 測wrong alg/aud/iss/brand/inbox/expired/future iat/kid
  then: 全部拒絕；合法token可交換
  blocking: true
  critical: true
- id: ID-003
  phase: M1
  area: 身分與SDK
  title: 一次性JWT併發
  given: 同一jti存在兩個同時交換請求
  when: 使用barrier同步送出
  then: 最多一次消耗；合法相同冪等重試回同session，不產生兩個會員session
  blocking: true
  critical: true
- id: ID-004
  phase: M1
  area: 身分與SDK
  title: Refresh rotation/reuse
  given: 合法visitor refresh token
  when: 旋轉後再次使用舊token
  then: 偵測reuse並撤銷該family，不接受已失效token
  blocking: true
  critical: true
- id: ID-005
  phase: M1
  area: 身分與SDK
  title: 宿主logout
  given: 會員A有草稿與socket
  when: 宿主logout後同瀏覽器登入B
  then: B看不到A歷史/未讀/草稿，舊session不再收資料
  blocking: true
  critical: true
- id: ID-006
  phase: M1
  area: 身分與SDK
  title: 匿名合併
  given: 匿名曾交談，之後登入會員
  when: 執行identify
  then: 預設不自動合併；顯式合併需兩方持有權與audit
  blocking: true
  critical: true
- id: ID-007
  phase: M1
  area: 身分與SDK
  title: postMessage隔離
  given: widget已handshake
  when: 錯origin/source/nonce發message
  then: 忽略，不執行命令；正確origin可用
  blocking: true
  critical: true
- id: ID-008
  phase: M1
  area: 身分與SDK
  title: SPA重複初始化
  given: 網站多次切頁/呼叫init
  when: 重複init/open/destroy再init
  then: 不多生iframe/socket/事件listener；destroy不冒充logout
  blocking: true
  critical: true
- id: ID-009
  phase: M1
  area: 身分與SDK
  title: 第三方cookie封鎖
  given: 瀏覽器封鎖第三方cookie
  when: 匿名/會員bootstrap、發訊息、重整
  then: 受限token機制可用；無法persist匿名時顯示合理狀態
  blocking: true
  critical: true
- id: ID-010
  phase: M1
  area: 身分與SDK
  title: 前端自訂欄位提權
  given: attributes有visitor-editable設定
  when: 傳VIP、balance、verified=true或別人contact_id
  then: 拒絕或忽略並依契約回錯，不成為可信業務事實
  blocking: true
  critical: true
- id: MSG-001
  phase: M1
  area: 訊息與狀態
  title: 訊息重送
  given: 一次POST已commit但response遺失
  when: 相同client_message_id/key/body重送10次
  then: 只一筆message，回原ID與seq，UI只一份
  blocking: true
  critical: true
- id: MSG-002
  phase: M1
  area: 訊息與狀態
  title: 同key不同body
  given: 既有idempotency record
  when: 同key換文字/附件再送
  then: 409，不污染既有內容
  blocking: true
  critical: true
- id: MSG-003
  phase: M1
  area: 訊息與狀態
  title: HTTP冪等到期
  given: message已存在，HTTP response cache清除
  when: 重送原source/client_message_id
  then: 長期unique仍抑制重複
  blocking: true
  critical: true
- id: MSG-004
  phase: M1
  area: 訊息與狀態
  title: 真正順序
  given: 兩條獨立PG連線並發寫同對話
  when: 用barrier控制commit/競爭
  then: message_seq單調唯一，不依UUID/created_at推序
  blocking: true
  critical: true
- id: MSG-005
  phase: M1
  area: 訊息與狀態
  title: 雙客服接單
  given: 一個human_queue案件
  when: 兩客服同時claim同version
  then: 一個成功，一個409；唯一assignee與一次容量占用
  blocking: true
  critical: true
- id: MSG-006
  phase: M1
  area: 訊息與狀態
  title: 容量競爭
  given: 某客服只剩一格容量
  when: 兩個案件同時自動分派給他
  then: 最多一件成功，另一留queue或分別人
  blocking: true
  critical: true
- id: MSG-007
  phase: M1
  area: 訊息與狀態
  title: 無人在線
  given: 沒有eligible available agent
  when: 會員要求人工
  then: human_queue/離線文案，不假裝已接通，不丟訊息
  blocking: true
  critical: true
- id: MSG-008
  phase: M1
  area: 訊息與狀態
  title: 過期人工操作
  given: 客服草稿仍在舊version
  when: 另一人先轉派，原人再公開送出
  then: 409並保存草稿，不越權回覆
  blocking: true
  critical: true
- id: MSG-009
  phase: M1
  area: 訊息與狀態
  title: 等待會員與結案
  given: 人工回覆並waiting_customer後接到新會員訊息
  when: 回覆→結案→72小時內新訊息
  then: 正確open/human→resolved→human_queue重開，報表周期不混淆
  blocking: true
  critical: true
- id: MSG-010
  phase: M1
  area: 訊息與狀態
  title: 過重開視窗
  given: 已結案超過72小時
  when: 往舊conversation POST會員訊息
  then: 409 NEW_CONVERSATION_REQUIRED；SDK新建related會話，原draft不丟失
  blocking: true
  critical: true
- id: MSG-011
  phase: M1
  area: 訊息與狀態
  title: Snooze容量
  given: 人工snoozed，容量已釋出且可能被占滿
  when: wake_at到達
  then: 重查資格/容量，適當回human或human_queue，不超賣
  blocking: true
  critical: true
- id: MSG-012
  phase: M1
  area: 訊息與狀態
  title: 已讀單調
  given: last_read_seq已較新
  when: 送舊seq或超過可見最新seq
  then: 舊seq不倒退，越界422，內部note不洩漏
  blocking: true
  critical: true
- id: MSG-013
  phase: M1
  area: 訊息與狀態
  title: WS缺口/重播
  given: 前端已套用event41，漏42收到43
  when: 重連補after41，或游標過期
  then: 正確套用42/43；expired410+一致snapshot，不漏訊息
  blocking: true
  critical: true
- id: MSG-014
  phase: M1
  area: 訊息與狀態
  title: Bigint安全
  given: seed seq大於2^53
  when: API→SDK→排序/補播
  then: 全程字串/BigInt安全，沒有精度丟失
  blocking: true
  critical: true
- id: UI-001
  phase: M1
  area: 前台與工作台
  title: 行動版與IME
  given: 窄螢幕/軟鍵盤/中文IME
  when: 組字Enter、附件、泡泡開關
  then: 組字不誤送，輸入框可見，close focus回原元素
  blocking: true
  critical: false
- id: UI-002
  phase: M1
  area: 前台與工作台
  title: 無障礙
  given: 只用鍵盤/螢幕閱讀器/放大200%
  when: 開泡泡、切對話、發訊息、轉人工
  then: 主要流程可完成，狀態非純色，live通知不洗版
  blocking: true
  critical: false
- id: UI-003
  phase: M1
  area: 前台與工作台
  title: 斷線待送
  given: 發訊息時斷網
  when: 恢復連線後重試
  then: 保留draft與原client id，無假成功/重複
  blocking: true
  critical: false
- id: UI-004
  phase: M1
  area: 前台與工作台
  title: 多分頁通知
  given: 同staff開三個分頁
  when: 收到同一事件
  then: 每頁列表正確，通知/聲音合理去重
  blocking: true
  critical: false
- id: FILE-001
  phase: M1
  area: 檔案
  title: 上傳偽裝
  given: 檔名jpg但magic為HTML/執行檔
  when: 上傳與complete
  then: 拒絕，不以客戶端Content-Type信任
  blocking: true
  critical: true
- id: FILE-002
  phase: M1
  area: 檔案
  title: 掃描未完成/故障
  given: 檔案在quarantined
  when: 附到訊息/給AI讀取/下載
  then: 禁止；掃描故障不fail open，文字聊天可用
  blocking: true
  critical: true
- id: FILE-003
  phase: M1
  area: 檔案
  title: 下載權限
  given: 另一brand/visitor知道file id
  when: 取signed URL或改message附件id
  then: 拒絕；已刪/撤銷後不發新URL
  blocking: true
  critical: true
- id: FILE-004
  phase: M2
  area: 檔案
  title: PDF限制
  given: 掃描PDF、巨型PDF、損壞文件
  when: 知識匯入
  then: 可理解OCR_REQUIRED/too_large/parse_failed，不假裝已索引
  blocking: true
  critical: true
- id: AI-001
  phase: M2
  area: AI接待
  title: 模型可完全關閉
  given: 未提供任何provider key
  when: 跑純人工M1流程
  then: 可用且不嘗試外部AI請求
  blocking: true
  critical: true
- id: AI-002
  phase: M2
  area: AI接待
  title: 人工先提交
  given: AI fake provider阻塞到指定barrier
  when: human claim/handoff先commit，再釋放AI
  then: 無新AI公開message；run stale/cancelled
  blocking: true
  critical: true
- id: AI-003
  phase: M2
  area: AI接待
  title: AI先提交
  given: AI已原子publish
  when: 人工接手
  then: 該答案作已發布歷史，之後不再自動回答，不聲稱可收回已送token
  blocking: true
  critical: true
- id: AI-004
  phase: M2
  area: AI接待
  title: 新問題廢止舊答案
  given: AI針對訊息A生成中
  when: 會員送B後AI完成A
  then: A的舊run不發布，新epoch可針對新語境處理
  blocking: true
  critical: true
- id: AI-005
  phase: M2
  area: AI接待
  title: Queue重跑final
  given: AI已publish，task重投/worker crash重試
  when: 重新執行相同run
  then: unique+狀態檢查，最多一筆final message
  blocking: true
  critical: true
- id: AI-006
  phase: M2
  area: AI接待
  title: Worker卡住
  given: AI worker永不返回或被kill
  when: deadline已到，watchdog獨立執行
  then: 10秒掃描周期後轉human_queue，舊lease不可再publish
  blocking: true
  critical: true
- id: AI-007
  phase: M2
  area: AI接待
  title: Assist不是autopilot
  given: human接待案件
  when: 客服生成AI draft
  then: 草稿僅staff可讀，不自動送客戶
  blocking: true
  critical: true
- id: AI-008
  phase: M2
  area: AI接待
  title: 原生協定
  given: 四種protocol有正常/錯誤fixture
  when: 執行adapter contract suite
  then: DTO一致，Anthropic/Gemini不硬套OpenAI格式
  blocking: true
  critical: true
- id: AI-009
  phase: M2
  area: AI接待
  title: 能力不支援
  given: model capabilities無tools/json/embedding
  when: 要求該功能
  then: CAPABILITY_UNSUPPORTED，非空成功或靜默忽略
  blocking: true
  critical: true
- id: AI-010
  phase: M2
  area: AI接待
  title: 截斷/拒答
  given: 上游返回refusal/empty/max_tokens或stream中斷
  when: 生成流程完成
  then: 不當完整成功，受控重試或交人工
  blocking: true
  critical: true
- id: AI-011
  phase: M2
  area: AI接待
  title: 重試放大
  given: SDK/queue可設定retry
  when: 429/500/timeout混合
  then: 每run不超2次provider嘗試，受90秒總deadline
  blocking: true
  critical: true
- id: AI-012
  phase: M2
  area: AI接待
  title: Fallback資料政策
  given: 備援provider未獲workspace同意
  when: 主provider故障
  then: 不外送資料給備援；交人工或只用已核准fallback
  blocking: true
  critical: true
- id: AI-013
  phase: M2
  area: AI接待
  title: 成本未知與預算
  given: usage缺失或多個run同時剩餘預算不足
  when: 生成/預留/結算
  then: unknown不記0，並發預留不超過設定，人工仍可用
  blocking: true
  critical: true
- id: AI-014
  phase: M2
  area: AI接待
  title: 停用即生效
  given: AI尚生成中
  when: 管理員kill switch或關鍵profile變動
  then: 新run不啟動，舊run發布前失效
  blocking: true
  critical: true
- id: AI-015
  phase: M2
  area: AI接待
  title: Prompt injection
  given: 會員/文件/工具結果含跳過規則與索取secret指令
  when: 檢索並生成
  then: 不超scope、不執行任意工具，不回secret
  blocking: true
  critical: true
- id: AI-016
  phase: M2
  area: AI接待
  title: 工具查本人資料
  given: 已驗證會員A、存在B订单
  when: 模型工具參數嘗試user_id=B或order屬B
  then: 後端ownership拒絕，ActorContext不由模型覆寫
  blocking: true
  critical: true
- id: RAG-001
  phase: M2
  area: 知識與檢索
  title: Staff-only隔離
  given: 公開與staff_only文件內容近似
  when: 外部auto retrieval/answer
  then: 排除staff_only，包括引用/日志/候選內容
  blocking: true
  critical: true
- id: RAG-002
  phase: M2
  area: 知識與檢索
  title: 草稿不生效
  given: 舊published版與新draft/indexing版
  when: 外部提問
  then: 只用舊核准發布版
  blocking: true
  critical: true
- id: RAG-003
  phase: M2
  area: 知識與檢索
  title: 發布原子性
  given: 新version部分chunks失敗
  when: 嘗試publish
  then: 拒絕；舊版仍可用，沒有半新半舊
  blocking: true
  critical: true
- id: RAG-004
  phase: M2
  area: 知識與檢索
  title: 撤下中生成
  given: AI檢索了將撤下文件
  when: 先unpublish再讓AI返回
  then: generation不符，重新檢索/交人工，舊答案不發布
  blocking: true
  critical: true
- id: RAG-005
  phase: M2
  area: 知識與檢索
  title: 換Embedding
  given: 不同模型即使同維度
  when: 切換model/profile
  then: 全量新profile重建；不能混用舊向量
  blocking: true
  critical: true
- id: RAG-006
  phase: M2
  area: 知識與檢索
  title: 維度與異常vector
  given: embedding回錯維度/NaN/空向量或3072維
  when: 建立/查詢索引
  then: 拒絕invalid；不建立不相容的vector HNSW；合法halfvec策略另評測
  blocking: true
  critical: true
- id: RAG-007
  phase: M2
  area: 知識與檢索
  title: 中文與精確碼
  given: 題庫含繁簡體/別名/ERR-1048/型號
  when: 比較vector/lexical/hybrid
  then: 可重現記錄召回與答案，未支持的斷詞不冒稱成熟
  blocking: true
  critical: true
- id: RAG-008
  phase: M2
  area: 知識與檢索
  title: 無答案與偽引用
  given: 沒有核准來源或模型輸出S99/任意URL
  when: 結果validation
  then: 不給假引用/確定答案，轉人工或一次澄清
  blocking: true
  critical: true
- id: RAG-009
  phase: M2
  area: 知識與檢索
  title: ANN過濾候選不足
  given: 多workspace資料且某inbox來源稀少
  when: 設定topK檢索
  then: 不洩漏其他租戶；必要時增加scan/精確fallback並紀錄
  blocking: true
  critical: true
- id: INT-001
  phase: M3
  area: 串接
  title: Webhook原始body簽章
  given: 合法HMAC payload
  when: 變空白/改body、錯timestamp/key id/signature
  then: 修改後拒絕；原始payload才接受
  blocking: true
  critical: true
- id: INT-002
  phase: M3
  area: 串接
  title: Inbound重送/亂序
  given: 相同external event/message與交錯timestamp
  when: 重送10次與亂序發送
  then: 原始message唯一，保存received/occurred時間，不無故倒退狀態
  blocking: true
  critical: true
- id: INT-003
  phase: M3
  area: 串接
  title: 持久化後才ACK
  given: DB不可用或commit前process crash
  when: sender發webhook
  then: 非2xx/連線失敗讓上游重送；不回假accepted
  blocking: true
  critical: true
- id: INT-004
  phase: M3
  area: 串接
  title: 外部送出未知
  given: 第三方已收到但HTTP response遺失
  when: client timeout
  then: delivery_unknown；無外部冪等不得盲重送
  blocking: true
  critical: true
- id: INT-005
  phase: M3
  area: 串接
  title: Outbound重送
  given: receiver第一次500後200
  when: 排程retry/手動retry
  then: event_id固定，新timestamp/signature，無secret洩漏與audit完整
  blocking: true
  critical: true
- id: INT-006
  phase: M3
  area: 串接
  title: 機器token scope
  given: api client只許某inbox寫入會員訊息
  when: 改brand/inbox或冒充staff
  then: 拒絕；token只能執行授權動作
  blocking: true
  critical: true
- id: OPS-001
  phase: M3
  area: 部署與恢復
  title: Redis失效
  given: 已收到會員訊息但queue enqueue失敗
  when: 關Redis後持續HTTP人工操作，再恢復Redis
  then: DB保留訊息/任務，dispatcher可恢復，不丟失/重複final
  blocking: true
  critical: true
- id: OPS-002
  phase: M3
  area: 部署與恢復
  title: Outbox crash window
  given: message+event commit後尚未發送或發送後尚未ACK
  when: kill dispatcher後重啟
  then: 至少一次event，consumer去重；不把event永久卡死
  blocking: true
  critical: true
- id: OPS-003
  phase: M3
  area: 部署與恢復
  title: 過期lease fencing
  given: worker A lease過期、B重新claim
  when: A晚回並想標完成/發布
  then: A不能覆蓋B ownership/結果
  blocking: true
  critical: true
- id: OPS-004
  phase: M3
  area: 部署與恢復
  title: Queue資源隔離
  given: 大量KB import與AI生成
  when: 同時人工發訊息/claim/watchdog
  then: core仍可服務；Redis payload只有IDs、不帶完整文件
  blocking: true
  critical: true
- id: OPS-005
  phase: M3
  area: 部署與恢復
  title: Timeout關係
  given: 配置core/ai/kb不同工作
  when: 驗證job<supervisor<retry_after且總deadline
  then: 配置測試拒絕不合理值；無tries=0
  blocking: true
  critical: true
- id: OPS-006
  phase: M3
  area: 部署與恢復
  title: 完整還原
  given: 真實備份含DB/附件/secret key metadata及erasure tombstone
  when: 還原至隔離環境
  then: 可登入/看授權歷史/搜尋/下載；刪除tombstone重播；記錄RPO/RTO
  blocking: true
  critical: true
- id: OPS-007
  phase: M3
  area: 部署與恢復
  title: 滾動部署
  given: 有running AI與連線訪客
  when: expand migration/worker重啟/回滾應用
  then: 舊新版本相容；不執行破壞性fresh migration
  blocking: true
  critical: true
- id: OPS-008
  phase: M3
  area: 部署與恢復
  title: 壓測與隔離
  given: SPEC參考資料量/硬體/fake模型
  when: 穩態30分鐘+2倍突發5分鐘
  then: 附p95/錯誤/資源圖與不變量結果，無實測不能標通過
  blocking: true
  critical: true
- id: OPS-009
  phase: M3
  area: 部署與恢復
  title: 匯出與刪除
  given: staff先申請匯出後被撤權；客戶有刪除要求
  when: 下載匯出/執行erasure/還原backup
  then: 下載重查權限；DB/文件/向量/cache一起清理；不得備份還原復活資料
  blocking: true
  critical: true
- id: OPS-010
  phase: M3
  area: 部署與恢復
  title: 授權與供應鏈
  given: 存在Composer/NPM/容器依賴
  when: 執行SBOM/license/audit與lockfile檢查
  then: 提交實際版本與結果；未掃描者不得標零風險
  blocking: true
  critical: true
