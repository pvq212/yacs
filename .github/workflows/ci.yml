name: 客服系統驗證
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, gd, intl, mbstring, zip, bcmath, gmp
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 準備執行環境
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cp .env.example .env
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          composer install --prefer-dist --no-interaction
          php artisan yacs:generate-keys
          npm ci
          docker compose -f compose.test.yaml up -d --wait postgres redis
      - name: 契約、型別與靜態檢查
        run: |
          composer validate --strict
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --memory-limit=1G
          npm run types:api
          git diff --exit-code -- resources/js/generated/api.d.ts resources/js/admin-schemas.json
          npm run typecheck
          npm test
          npm run build
      - name: 真實 PostgreSQL 整合測試
        run: scripts/artisan-test.sh test
      - name: Docker 與瀏覽器測試
        run: |
          docker compose build app
          docker compose up -d --wait postgres redis-cache redis-queue mailpit
          docker compose run --rm --no-deps app php artisan migrate --database=pgsql_migrator --force
          docker compose run --rm --no-deps app php artisan yacs:demo
          docker compose up -d --wait app reverb horizon scheduler
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: 建置正式映像
        run: docker build --target prod -f infra/docker/app/Dockerfile -t yacs-app:ci .
